        // Import data from JSON file
        async function importData(event) {
            const password = prompt('Enter password to upload backup:');
            if (password !== 'admin') {
                if (password !== null) alert('Incorrect password!');
                event.target.value = '';
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    if (typeof importedData !== 'object' || importedData === null) {
                        throw new Error('Invalid data format');
                    }

                    const currentCount = Object.keys(dinnerData).length;
                    const importCount = Object.keys(importedData).length;

                    if (currentCount > 0) {
                        if (!confirm(`This will replace your current ${currentCount} entries with ${importCount} entries from the backup. Continue?`)) {
                            event.target.value = '';
                            return;
                        }
                    }

                    showLoading('Importing data...');

                    try {
                        await resetSheets();

                        for (const [country, data] of Object.entries(importedData)) {
                            await saveDataToSheets(country, data);
                        }

                        dinnerData = importedData;

                        Object.keys(countryLayers).forEach(countryName => {
                            updateCountryOnMap(countryName);
                        });

                        updateUI();
                        alert(`Backup restored successfully! ${importCount} countries loaded.`);
                    } catch (error) {
                        console.error('Import error:', error);
                        alert('Error importing data. Please try again.');
                    } finally {
                        hideLoading();
                    }
                } catch (error) {
                    alert('Error reading backup file. Please make sure it is a valid backup file.');
                    console.error('Import error:', error);
                }

                event.target.value = '';
            };
            reader.readAsText(file);
        }

        /* ===================== 3D WEBGL GLOBE ===================== */
        let GLOBE = null;
        let globeView = 'map';
        let globeLibPromise = null;
        let globeReady = false;
        let countryCentroids = {};

        // Centroid (lat/lng) of each country's largest landmass, from the GeoJSON
        function computeCentroids() {
            if (!geojsonData || Object.keys(countryCentroids).length) return;
            geojsonData.features.forEach(f => {
                const g = f.geometry;
                if (!g) return;
                const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
                let best = null, bestArea = -1;
                polys.forEach(poly => {
                    const ring = poly[0];
                    if (!ring || !ring.length) return;
                    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity, sx = 0, sy = 0;
                    ring.forEach(pt => {
                        const x = pt[0], y = pt[1];
                        if (x < minx) minx = x; if (x > maxx) maxx = x;
                        if (y < miny) miny = y; if (y > maxy) maxy = y;
                        sx += x; sy += y;
                    });
                    const area = (maxx - minx) * (maxy - miny);
                    if (area > bestArea) { bestArea = area; best = { lng: sx / ring.length, lat: sy / ring.length }; }
                });
                if (best) countryCentroids[f.properties.name] = best;
            });
        }

        function loadGlobeLib() {
            if (window.Globe) return Promise.resolve();
            if (globeLibPromise) return globeLibPromise;
            globeLibPromise = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js';
                s.onload = () => resolve();
                s.onerror = () => { globeLibPromise = null; reject(new Error('Failed to load globe.gl')); };
                document.head.appendChild(s);
            });
            return globeLibPromise;
        }

        function globeCapColor(feat) {
            const name = feat.properties.name;
            const d = dinnerData[name];
            if (TOUR.running && TOUR.activeCountry) {
                if (name === TOUR.activeCountry) {
                    return !d || d.family === 'riley' ? 'rgba(125,240,255,0.95)' : 'rgba(253,224,120,0.95)';
                }
                if (d) return d.family === 'riley' ? 'rgba(34,211,238,0.30)' : 'rgba(251,191,36,0.30)';
                return 'rgba(70,80,100,0.05)';
            }
            if (d) return d.family === 'riley' ? 'rgba(34,211,238,0.82)' : 'rgba(251,191,36,0.82)';
            return 'rgba(120,132,155,0.10)';
        }
        function globeSideColor(feat) {
            const d = dinnerData[feat.properties.name];
            if (d) return d.family === 'riley' ? 'rgba(13,110,140,0.92)' : 'rgba(176,116,20,0.92)';
            return 'rgba(60,70,92,0.18)';
        }
        function globeAltitude(feat) {
            const name = feat.properties.name;
            const d = dinnerData[name];
            if (TOUR.running && TOUR.activeCountry === name) return 0.16;
            return d ? 0.06 : 0.007;
        }
        function globeLabel(feat) {
            const name = feat.properties.name;
            const d = dinnerData[name];
            let h = '<div style="font:600 13px Inter,system-ui,sans-serif;color:#fff;background:rgba(11,13,20,0.94);' +
                'border:1px solid rgba(255,255,255,0.14);padding:8px 12px;border-radius:10px;max-width:240px">' +
                escapeHtml(name);
            if (d) {
                h += '<br><span style="color:' + (d.family === 'riley' ? '#67e8f9' : '#fcd34d') + ';font-weight:700">' +
                    (d.family === 'riley' ? 'Riley' : 'Murry') + ' family</span>';
                if (d.cuisine) h += '<br><span style="color:#9aa3b8">' + escapeHtml(d.cuisine) + '</span>';
                if (d.notes) h += '<br><span style="color:#828aa0;font-style:italic">' + escapeHtml(d.notes) + '</span>';
            } else {
                h += '<br><span style="color:#828aa0">Not done yet</span>';
            }
            return h + '</div>';
        }

        function buildGlobeArcs() {
            const list = tourList();
            const arcs = [];
            for (let i = 0; i < list.length - 1; i++) {
                const a = countryCentroids[list[i]], b = countryCentroids[list[i + 1]];
                if (!a || !b) continue;
                arcs.push({
                    startLat: a.lat, startLng: a.lng, endLat: b.lat, endLng: b.lng,
                    color: ['rgba(158,193,255,0.12)', 'rgba(158,193,255,0.9)'], order: i
                });
            }
            return arcs;
        }
        function buildGlobeRings() {
            return Object.keys(dinnerData).map(name => {
                const c = countryCentroids[name];
                if (!c) return null;
                const riley = dinnerData[name].family === 'riley';
                return {
                    lat: c.lat, lng: c.lng,
                    color: t => (riley ? 'rgba(34,211,238,' : 'rgba(251,191,36,') + (1 - t).toFixed(2) + ')'
                };
            }).filter(Boolean);
        }

        function refreshGlobeData() {
            if (!GLOBE) return;
            GLOBE.polygonsData(geojsonData.features.slice())
                .polygonCapColor(globeCapColor)
                .polygonAltitude(globeAltitude)
                .arcsData(buildGlobeArcs())
                .ringsData(buildGlobeRings());
        }

        // Cheap repaint of just the polygon styling (used during the tour)
        function globeRepaint() {
            if (!GLOBE) return;
            GLOBE.polygonsData(geojsonData.features.slice())
                .polygonCapColor(globeCapColor)
                .polygonAltitude(globeAltitude);
        }

        function sizeGlobe() {
            if (!GLOBE) return;
            const el = document.getElementById('globeViz');
            const rect = el.getBoundingClientRect();
            GLOBE.width(Math.max(rect.width, 200)).height(Math.max(rect.height, 200));
        }

        async function initGlobe() {
            if (GLOBE) return;
            await loadGlobeLib();
            if (!geojsonData) throw new Error('Map data not ready');
            computeCentroids();

            GLOBE = Globe()(document.getElementById('globeViz'))
                .backgroundColor('rgba(0,0,0,0)')
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
                .showAtmosphere(true)
                .atmosphereColor('#3b82f6')
                .atmosphereAltitude(0.16)
                .polygonsData(geojsonData.features.slice())
                .polygonCapColor(globeCapColor)
                .polygonSideColor(globeSideColor)
                .polygonStrokeColor(() => 'rgba(255,255,255,0.12)')
                .polygonAltitude(globeAltitude)
                .polygonsTransitionDuration(500)
                .polygonLabel(globeLabel)
                .onPolygonClick(feat => openCountryModal(feat.properties.name))
                .arcColor('color')
                .arcStroke(0.55)
                .arcDashLength(0.4)
                .arcDashGap(0.18)
                .arcDashInitialGap(a => a.order * 0.35)
                .arcDashAnimateTime(2600)
                .arcAltitudeAutoScale(0.45)
                .arcsTransitionDuration(700)
                .ringColor('color')
                .ringMaxRadius(3.6)
                .ringPropagationSpeed(1.2)
                .ringRepeatPeriod(1700)
                .ringAltitude(0.061);

            const controls = GLOBE.controls();
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.42;
            controls.enableDamping = true;
            controls.dampingFactor = 0.12;
            controls.minDistance = 135;
            controls.maxDistance = 520;

            GLOBE.pointOfView({ lat: 22, lng: 8, altitude: 2.0 }, 0);
            sizeGlobe();
            refreshGlobeData();
            globeReady = true;
        }

        function setView(v) {
            if (v === globeView) return;
            const wrap = document.querySelector('.map-wrap');
            const styleGroup = document.getElementById('styleGroup');

            if (v === 'globe') {
                showLoading('Spinning up the globe…');
                initGlobe().then(() => {
                    globeView = 'globe';
                    wrap.classList.add('globe');
                    if (styleGroup) styleGroup.style.display = 'none';
                    document.querySelectorAll('.vt-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'globe'));
                    setTimeout(sizeGlobe, 60);
                    hideLoading();
                }).catch(err => {
                    console.error('Globe init failed:', err);
                    hideLoading();
                    alert('Could not load the 3D globe — check your connection and try again.');
                });
            } else {
                globeView = 'map';
                wrap.classList.remove('globe');
                if (styleGroup) styleGroup.style.display = '';
                document.querySelectorAll('.vt-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'map'));
                if (map) setTimeout(() => map.invalidateSize(), 60);
            }
        }

        window.addEventListener('resize', () => {
            if (GLOBE && (globeView === 'globe' || TOUR.onGlobe)) sizeGlobe();
        });

        /* ================= CINEMA TOUR / SCREENSAVER ================= */
        const TOUR = {
            running: false,
            idx: 0,
            order: [],
            timers: [],
            map: null,
            layers: {},
            arc: null,
            startedAt: 0,
            wasFs: false,
            onGlobe: false,
            activeCountry: null,
            stepToken: 0,
            reduced: window.matchMedia('(prefers-reduced-motion: reduce)').matches
        };
        const TOUR_IDLE_MS = 180000; // auto-start after 3 minutes idle
        let tourIdleTimer = null;

        function tourClearTimers() {
            TOUR.timers.forEach(t => clearTimeout(t));
            TOUR.timers = [];
        }

        // Completed countries, oldest dinner first (falls back to A-Z)
        function tourList() {
            return Object.keys(dinnerData).sort((a, b) => {
                const da = dinnerData[a].dateAdded || '';
                const db = dinnerData[b].dateAdded || '';
                if (da && db && da !== db) return da.localeCompare(db);
                if (da && !db) return -1;
                if (!da && db) return 1;
                return a.localeCompare(b);
            });
        }

        function tourCountryStyle(name, active) {
            const dinner = dinnerData[name];
            if (!dinner) {
                return { fillColor: '#3a4150', fillOpacity: 0.14, color: '#2b3140', weight: 0.4 };
            }
            const isRiley = dinner.family === 'riley';
            const col = isRiley ? '#22d3ee' : '#fbbf24';
            if (active) {
                return { fillColor: col, fillOpacity: 0.8, color: '#ffffff', weight: 2.2 };
            }
            return { fillColor: col, fillOpacity: 0.32, color: isRiley ? '#67e8f9' : '#fcd34d', weight: 1 };
        }

        function buildTourMap() {
            if (TOUR.map || !geojsonData) return;
            TOUR.map = L.map('tourMap', {
                zoomControl: false,
                attributionControl: true,
                dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
                boxZoom: false, keyboard: false, touchZoom: false, tap: false,
                zoomSnap: 0.1, worldCopyJump: true
            }).setView([20, 0], 2);

            L.tileLayer(mapStyles.osm.url, {
                attribution: mapStyles.osm.attribution,
                maxZoom: mapStyles.osm.maxZoom || 18
            }).addTo(TOUR.map);

            L.geoJSON(geojsonData, {
                style: feature => tourCountryStyle(feature.properties.name, false),
                onEachFeature: (feature, layer) => { TOUR.layers[feature.properties.name] = layer; }
            }).addTo(TOUR.map);
        }

        // Spotlight: brighten the active country, dim the rest
        function tourPaint(activeName) {
            Object.keys(TOUR.layers).forEach(name => {
                const layer = TOUR.layers[name];
                const isActive = name === activeName;
                layer.setStyle(tourCountryStyle(name, isActive));
                if (layer._path) {
                    layer._path.classList.remove('tour-active-riley', 'tour-active-murry');
                    if (isActive && dinnerData[name]) {
                        layer._path.classList.add(dinnerData[name].family === 'riley' ? 'tour-active-riley' : 'tour-active-murry');
                    }
                }
                if (isActive) layer.bringToFront();
            });
        }

        // Bounds of a country's largest landmass (many countries include far-flung
        // territories that would otherwise make the camera fit the whole globe)
        function tourCountryBounds(layer) {
            let best = null, bestArea = -1;
            function consider(ring) {
                const b = L.latLngBounds(ring);
                if (!b.isValid()) return;
                const area = (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest());
                if (area > bestArea) { bestArea = area; best = b; }
            }
            function walk(arr) {
                if (!arr || !arr.length) return;
                if (arr[0] instanceof L.LatLng) { consider(arr); return; }
                arr.forEach(walk);
            }
            try { walk(layer.getLatLngs()); } catch (e) { /* ignore */ }
            return best || layer.getBounds();
        }

        // Where the camera should sit for a country: centred a little below the
        // landmass so it frames above the caption card
        function tourTarget(layer) {
            const b = tourCountryBounds(layer);
            const c = b.getCenter();
            const latSpan = Math.max(b.getNorth() - b.getSouth(), 0.5);
            let zoom = 3;
            try { zoom = TOUR.map.getBoundsZoom(b, false, L.point(120, 360)); } catch (e) { /* ignore */ }
            zoom = Math.max(2.4, Math.min(zoom, 5));
            return { center: L.latLng(c.lat - latSpan * 0.18, c.lng), zoom: zoom };
        }

        // Glowing curved arc from the previous country to the current one
        function tourDrawArc(fromName, toName) {
            if (TOUR.arc) { TOUR.map.removeLayer(TOUR.arc); TOUR.arc = null; }
            const a = TOUR.layers[fromName], b = TOUR.layers[toName];
            if (!a || !b) return;
            const p1 = tourCountryBounds(a).getCenter();
            const p2 = tourCountryBounds(b).getCenter();
            const mid = L.latLng((p1.lat + p2.lat) / 2, (p1.lng + p2.lng) / 2);
            const dx = p2.lng - p1.lng, dy = p2.lat - p1.lat;
            const norm = Math.hypot(dx, dy) || 1;
            const off = Math.min(norm * 0.32, 20);
            const cp = L.latLng(mid.lat + (-dx / norm) * off, mid.lng + (dy / norm) * off);
            const pts = [];
            for (let t = 0; t <= 1.0001; t += 0.04) {
                const lat = (1 - t) * (1 - t) * p1.lat + 2 * (1 - t) * t * cp.lat + t * t * p2.lat;
                const lng = (1 - t) * (1 - t) * p1.lng + 2 * (1 - t) * t * cp.lng + t * t * p2.lng;
                pts.push([lat, lng]);
            }
            TOUR.arc = L.polyline(pts, {
                color: '#9ec1ff', weight: 2, opacity: 0.85, className: 'tour-arc'
            }).addTo(TOUR.map);
        }

        function tourRenderDots() {
            const wrap = document.getElementById('tourDots');
            const n = TOUR.order.length;
            if (wrap.children.length !== n) {
                wrap.innerHTML = '';
                for (let i = 0; i < n; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'tour-dot';
                    wrap.appendChild(dot);
                }
            }
            Array.from(wrap.children).forEach((dot, i) => {
                dot.classList.toggle('active', i === TOUR.idx);
                dot.classList.toggle('done', i < TOUR.idx);
            });
        }

        function tourRenderCaption(name) {
            const d = dinnerData[name] || {};
            const fam = d.family === 'riley' ? 'riley' : 'murry';
            const famLabel = d.family === 'riley' ? 'Riley family' : 'Murry family';
            let when = '';
            if (d.dateAdded) {
                const dt = new Date(d.dateAdded);
                if (!isNaN(dt)) when = dt.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
            }
            const meta = [`<span class="tour-cap-badge ${fam}">${famLabel}</span>`];
            if (d.cuisine) meta.push(`<span>${escapeHtml(d.cuisine)}</span>`);
            if (d.difficulty) meta.push(`<span>${escapeHtml(d.difficulty.charAt(0).toUpperCase() + d.difficulty.slice(1))}</span>`);
            const kicker = `Dinner ${TOUR.idx + 1} of ${TOUR.order.length}` + (when ? ` &nbsp;&middot;&nbsp; ${escapeHtml(when)}` : '');
            document.getElementById('tourCaption').innerHTML =
                `<div class="tour-cap-kicker">${kicker}</div>` +
                `<div class="tour-cap-name">${escapeHtml(name)}</div>` +
                `<div class="tour-cap-meta">${meta.join('')}</div>` +
                (d.notes ? `<div class="tour-cap-notes">&ldquo;${escapeHtml(d.notes)}&rdquo;</div>` : '');
        }

        function tourStep() {
            if (!TOUR.running) return;
            const token = ++TOUR.stepToken;
            tourClearTimers();
            const name = TOUR.order[TOUR.idx];
            const prev = TOUR.order[(TOUR.idx - 1 + TOUR.order.length) % TOUR.order.length];
            const layer = TOUR.layers[name];
            const cap = document.getElementById('tourCaption');

            cap.classList.remove('show');
            tourRenderDots();

            const flight = TOUR.reduced ? 0.6 : 3.4;
            const hold = TOUR.reduced ? 4 : 6.5;

            let target = null;
            if (layer) {
                if (TOUR.order.length > 1 && prev !== name) tourDrawArc(prev, name);
                target = tourTarget(layer);
                try {
                    TOUR.map.flyTo(target.center, target.zoom, { duration: flight, easeLinearity: 0.25 });
                } catch (e) { /* ignore */ }
            }
            tourPaint(name);

            // Reveal the caption once the camera has arrived, then slow Ken-Burns drift
            TOUR.timers.push(setTimeout(() => {
                if (!TOUR.running || token !== TOUR.stepToken) return;

                // Fallback: if the fly animation stalled, snap to the target
                if (target && TOUR.map) {
                    const c = TOUR.map.getCenter();
                    const off = Math.abs(c.lat - target.center.lat) + Math.abs(c.lng - target.center.lng);
                    if (off > 3 || Math.abs(TOUR.map.getZoom() - target.zoom) > 0.6) {
                        try { TOUR.map.setView(target.center, target.zoom, { animate: false }); } catch (e) { /* ignore */ }
                    }
                }

                tourRenderCaption(name);
                cap.classList.add('show');

                if (!TOUR.reduced && TOUR.map) {
                    const c = TOUR.map.getCenter();
                    const z = TOUR.map.getZoom();
                    const b = TOUR.map.getBounds();
                    const latSpan = b.getNorth() - b.getSouth();
                    const lngSpan = b.getEast() - b.getWest();
                    try {
                        TOUR.map.flyTo(
                            [c.lat + (Math.random() - 0.5) * latSpan * 0.16, c.lng + (Math.random() - 0.5) * lngSpan * 0.16],
                            Math.min(z + 0.3, 6.5),
                            { duration: hold, easeLinearity: 1 }
                        );
                    } catch (e) { /* ignore */ }
                }

                // Advance
                TOUR.timers.push(setTimeout(() => {
                    if (!TOUR.running || token !== TOUR.stepToken) return;
                    TOUR.idx = (TOUR.idx + 1) % TOUR.order.length;
                    tourStep();
                }, hold * 1000 + 500));
            }, flight * 1000 + 150));
        }

        // One step of the tour when it is flying the 3D globe
        function tourStepGlobe() {
            if (!TOUR.running) return;
            const token = ++TOUR.stepToken;
            tourClearTimers();
            const name = TOUR.order[TOUR.idx];
            const cap = document.getElementById('tourCaption');
            cap.classList.remove('show');
            tourRenderDots();

            const flight = TOUR.reduced ? 0.8 : 3.8;
            const hold = TOUR.reduced ? 4 : 6.5;

            TOUR.activeCountry = name;
            globeRepaint();

            const c = countryCentroids[name];
            if (c && GLOBE) {
                try { GLOBE.pointOfView({ lat: c.lat, lng: c.lng, altitude: 1.45 }, flight * 1000); } catch (e) { /* ignore */ }
            }

            TOUR.timers.push(setTimeout(() => {
                if (!TOUR.running || token !== TOUR.stepToken) return;
                tourRenderCaption(name);
                cap.classList.add('show');
                if (!TOUR.reduced && c && GLOBE) {
                    try {
                        GLOBE.pointOfView({ lat: c.lat + 3, lng: c.lng + 8, altitude: 1.62 }, hold * 1000);
                    } catch (e) { /* ignore */ }
                }

                TOUR.timers.push(setTimeout(() => {
                    if (!TOUR.running || token !== TOUR.stepToken) return;
                    TOUR.idx = (TOUR.idx + 1) % TOUR.order.length;
                    tourStepGlobe();
                }, hold * 1000 + 500));
            }, flight * 1000 + 200));
        }

        function startTour(auto) {
            if (TOUR.running) return;
            const list = tourList();
            if (list.length === 0) {
                if (!auto) alert('Add a few dinners first — then the tour will have something to show!');
                return;
            }
            if (!geojsonData) {
                if (!auto) alert('The map is still loading. Try again in a moment.');
                return;
            }

            TOUR.order = list;
            TOUR.idx = 0;
            TOUR.running = true;
            TOUR.startedAt = Date.now();
            TOUR.wasFs = false;
            TOUR.activeCountry = null;
            TOUR.onGlobe = (globeView === 'globe' && GLOBE && globeReady);

            const stage = document.getElementById('tourStage');
            stage.classList.add('active');
            document.body.style.overflow = 'hidden';

            if (TOUR.onGlobe) {
                stage.classList.add('tour-globe-mode');
                stage.insertBefore(document.getElementById('globeViz'), stage.firstChild);
                GLOBE.controls().autoRotate = false;
            } else {
                buildTourMap();
            }

            if (!auto && stage.requestFullscreen) {
                stage.requestFullscreen().catch(() => {});
            }

            TOUR.timers.push(setTimeout(() => {
                if (!TOUR.running) return;
                if (TOUR.onGlobe) {
                    sizeGlobe();
                    tourStepGlobe();
                } else {
                    if (TOUR.map) TOUR.map.invalidateSize();
                    tourStep();
                }
            }, 380));

            document.addEventListener('keydown', tourKeyExit, true);
            document.addEventListener('pointerdown', tourPointerExit, true);
            document.addEventListener('mousemove', tourMoveExit, true);
            document.addEventListener('fullscreenchange', tourFsChange);
        }

        function stopTour() {
            if (!TOUR.running) return;
            TOUR.running = false;
            tourClearTimers();
            document.removeEventListener('keydown', tourKeyExit, true);
            document.removeEventListener('pointerdown', tourPointerExit, true);
            document.removeEventListener('mousemove', tourMoveExit, true);
            document.removeEventListener('fullscreenchange', tourFsChange);

            const stage = document.getElementById('tourStage');
            document.getElementById('tourCaption').classList.remove('show');
            stage.classList.remove('active');
            document.body.style.overflow = '';
            if (TOUR.arc && TOUR.map) { TOUR.map.removeLayer(TOUR.arc); TOUR.arc = null; }

            if (TOUR.onGlobe) {
                stage.classList.remove('tour-globe-mode');
                document.querySelector('.map-wrap').appendChild(document.getElementById('globeViz'));
                TOUR.activeCountry = null;
                globeRepaint();
                if (GLOBE) {
                    GLOBE.controls().autoRotate = true;
                    GLOBE.pointOfView({ lat: 22, lng: 8, altitude: 2.0 }, 900);
                    setTimeout(sizeGlobe, 60);
                }
                TOUR.onGlobe = false;
            }

            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            resetTourIdle();
        }

        function tourKeyExit() { stopTour(); }
        function tourPointerExit() {
            if (Date.now() - TOUR.startedAt < 700) return;
            stopTour();
        }
        function tourMoveExit(e) {
            if (Date.now() - TOUR.startedAt < 1600) return;
            if (Math.abs(e.movementX) + Math.abs(e.movementY) > 8) stopTour();
        }
        function tourFsChange() {
            if (TOUR.map) setTimeout(() => { if (TOUR.map) TOUR.map.invalidateSize(); }, 180);
            if (TOUR.onGlobe) setTimeout(sizeGlobe, 200);
            if (TOUR.running && TOUR.wasFs && !document.fullscreenElement) {
                stopTour();
            }
            TOUR.wasFs = !!document.fullscreenElement;
        }

        function resetTourIdle() {
            clearTimeout(tourIdleTimer);
            tourIdleTimer = setTimeout(() => {
                if (!TOUR.running && !document.hidden && !document.getElementById('countryModal').classList.contains('active')) {
                    startTour(true);
                }
            }, TOUR_IDLE_MS);
        }

        function setupIdleWatch() {
            ['mousemove', 'keydown', 'pointerdown', 'wheel', 'touchstart'].forEach(ev => {
                document.addEventListener(ev, () => {
                    if (!TOUR.running) resetTourIdle();
                }, { passive: true });
            });
            resetTourIdle();
        }

        // Delegated actions for the completed-countries list
        document.getElementById('completedList').addEventListener('click', function(e) {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const country = btn.dataset.country;
            if (btn.dataset.act === 'zoom') zoomToCountry(country);
            else if (btn.dataset.act === 'edit') editCountry(country);
            else if (btn.dataset.act === 'delete') deleteCountry(country);
        });

        // Close modal when clicking outside
        document.getElementById('countryModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Initialize app when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
